[project]
name = "causalgeo"
version = "0.1.0"
description = "Geo experiment analysis: go-dark, holdback, and heavy-up lift (ATT, percent lift, iCPD)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aditya Puttaparthi Tirumala" }]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
paper = ["matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
